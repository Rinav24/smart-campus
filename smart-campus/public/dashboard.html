<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Smart Campus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span> Smart Campus</div>
    <nav id="nav" aria-label="Main menu"></nav>
    <div class="user-box">
      <div class="name" id="uName"></div>
      <div id="uRole" class="mb-2"></div>
      <button class="btn btn-sm btn-outline-light w-100" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Log out</button>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <button class="btn btn-outline-secondary btn-sm menu-btn" id="menuBtn" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <h1 id="pageTitle">Dashboard</h1>
      <span class="date" id="today"></span>
    </header>
    <main class="page" id="page"><div class="empty">Loading...</div></main>
  </div>

  <!-- One reusable pop-up window used by every form -->
  <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <form class="modal-content" id="modalForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-campus" id="modalSubmit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-area" id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
