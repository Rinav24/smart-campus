<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student registration - Smart Campus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <aside class="auth-side">
    <div class="brand"><span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span> Smart Campus</div>
    <div>
      <h1>Join your campus portal.</h1>
      <ul>
        <li><i class="bi bi-person-check"></i>Track your attendance</li>
        <li><i class="bi bi-journal-check"></i>Submit assignments on time</li>
        <li><i class="bi bi-chat-left-text"></i>Raise complaints and get replies</li>
      </ul>
    </div>
    <small>Faculty and admin accounts are created by the administrator.</small>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <h2>Student registration</h2>
      <p class="text-secondary">Fill in your details to create an account.</p>
      <div id="msg"></div>
      <form id="regForm" novalidate>
        <div class="mb-3"><label class="form-label" for="name">Full name</label>
          <input class="form-control" id="name" required></div>
        <div class="mb-3"><label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" type="email" required></div>
        <div class="row g-3 mb-3">
          <div class="col-7"><label class="form-label" for="roll_no">Roll number</label>
            <input class="form-control" id="roll_no" required></div>
          <div class="col-5"><label class="form-label" for="semester">Semester</label>
            <select class="form-select" id="semester" required>
              <option value="">Select</option>
              <option>1</option><option>2</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option>7</option><option>8</option>
            </select></div>
        </div>
        <div class="mb-3"><label class="form-label" for="department_id">Department</label>
          <select class="form-select" id="department_id" required><option value="">Loading...</option></select></div>
        <div class="mb-3"><label class="form-label" for="phone">Phone (optional)</label>
          <input class="form-control" id="phone" inputmode="tel"></div>
        <div class="mb-3"><label class="form-label" for="password">Password (min 6 characters)</label>
          <input class="form-control" id="password" type="password" autocomplete="new-password" required></div>
        <button class="btn btn-campus w-100 py-2" id="btn" type="submit">Create account</button>
      </form>
      <p class="mt-3 text-center">Already registered? <a href="login.html">Sign in</a></p>
    </div>
  </main>
</div>

<script>
  fetch('/api/auth/departments').then(r => r.json()).then(list => {
    document.getElementById('department_id').innerHTML =
      '<option value="">Select</option>' + list.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
  });

  document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');
    const val = id => document.getElementById(id).value.trim();
    msg.innerHTML = '';
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: val('name'), email: val('email'), roll_no: val('roll_no'), semester: val('semester'),
          department_id: val('department_id'), phone: val('phone'), password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Registration failed.');
      msg.innerHTML = '<div class="alert alert-success py-2">' + data.message + ' Redirecting...</div>';
      setTimeout(() => location.href = 'login.html', 1400);
    } catch (err) {
      msg.innerHTML = '<div class="alert alert-danger py-2">' + err.message + '</div>';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
